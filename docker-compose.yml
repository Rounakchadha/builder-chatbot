services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loanbot
      POSTGRES_PASSWORD: loanbot
      POSTGRES_DB: loanbot_v1
    ports:
      # Security-review finding, 2026-11-02: bound to all interfaces before this, so Postgres was
      # reachable from the open internet on :5435, not just this host — rebound to localhost-only.
      # The server container still reaches it fine (same Docker network, internal DNS), this only
      # affects connections coming from OUTSIDE the host. To debug from your own machine, SSH-tunnel
      # in instead (e.g. `ssh -L 5435:localhost:5435 rounak_uat@200.97.170.143`).
      - '127.0.0.1:5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loanbot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Same fix as postgres above — was reachable from outside the host on :6381, now localhost-only.
      - '127.0.0.1:6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Standalone Home Loan eligibility pre-check (21 real lenders) — see
  # hl-eligibility-precheck/README.md. Only reachable from inside this compose network (no `ports:`
  # published to the host) — the `server` service below reaches it by this service name, same as
  # postgres/redis above. Bug fixed 2026-11-16: server/.env's own HL_ELIGIBILITY_SERVICE_URL used
  # to say `http://localhost:8096`, which from INSIDE the server container's own network namespace
  # means the container's own loopback, not this host — nothing was ever listening there, hence the
  # ECONNREFUSED every single request. Fixed below by overriding that env var to this service's
  # Docker DNS name instead (same override pattern already used for DATABASE_URL/REDIS_URL below —
  # docker compose's `environment:` always wins over `env_file` for the same key).
  hl-eligibility:
    build:
      context: ./hl-eligibility-precheck
      dockerfile: Dockerfile
    environment:
      PORT: '8096'
      # From the project-root .env file (gitignored, read automatically by `docker compose`) — never
      # a literal value here, which would otherwise commit a real shared secret to git in plaintext.
      INTERNAL_API_KEY: ${HL_ELIGIBILITY_INTERNAL_KEY}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8096/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://loanbot:loanbot@postgres:5432/loanbot_v1
      REDIS_URL: redis://redis:6379
      PORT: '8080'
      HL_ELIGIBILITY_SERVICE_URL: http://hl-eligibility:8096
      HL_ELIGIBILITY_API_KEY: ${HL_ELIGIBILITY_INTERNAL_KEY}
      # The UAT branch's docker-compose.yml disables TLS certificate verification here as a
      # workaround for a proxy on that server's own network path — deliberately NOT carried onto
      # this prod branch (real customer PII flows through here; if prod's network path has the same
      # self-signed-cert issue, fix it by trusting the actual intercepting CA cert instead of
      # disabling verification).
      # Bug fixed 2026-11-07 — logs used to only live in the container's own stdout, which `deploy.sh`
      # throws away every time it recreates this container (see lib/logger.ts's own comment on why).
      # Pointed at a named volume (below) instead of the container's writable layer, so a deploy no
      # longer erases everything that happened before it.
      LOG_DIR: /app/server/logs
    ports:
      - '8091:8080'
    volumes:
      - serverlogs:/app/server/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hl-eligibility:
        condition: service_healthy
    # Security-review finding, 2026-10-23: unlike postgres/redis above, this service had neither a
    # healthcheck nor a restart policy — if the process crashed, nothing brought it back, and
    # nothing here could detect it being up-but-broken either. node's built-in fetch (Node 20) avoids
    # needing curl/wget in the slim runtime image. Hits the same /health this batch hardened to
    # actually check Postgres/Redis (see src/index.ts), not just "the process is still running".
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  serverlogs:
