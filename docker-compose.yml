services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loanbot
      POSTGRES_PASSWORD: loanbot
      POSTGRES_DB: loanbot_v1
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loanbot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://loanbot:loanbot@postgres:5432/loanbot_v1
      REDIS_URL: redis://redis:6379
      PORT: '8080'
      # TEMPORARY UAT-testing-only workaround (2026-09-24): this server's own network path to
      # backend.uatfinfinity.in goes through something (a hosting-provider/corporate proxy, most
      # likely) presenting a self-signed certificate Node doesn't trust, which blocks every real
      # API call with "self-signed certificate in certificate chain". This disables TLS certificate
      # verification for the whole container so testing isn't blocked. Do NOT carry this into
      # production or once real customer PII is flowing — the proper fix is adding whatever CA
      # certificate is actually doing the interception to the container's trusted store instead.
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    ports:
      - '8091:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Security-review finding, 2026-10-23: unlike postgres/redis above, this service had neither a
    # healthcheck nor a restart policy — if the process crashed, nothing brought it back, and
    # nothing here could detect it being up-but-broken either. node's built-in fetch (Node 20) avoids
    # needing curl/wget in the slim runtime image. Hits the same /health this batch hardened to
    # actually check Postgres/Redis (see src/index.ts), not just "the process is still running".
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
